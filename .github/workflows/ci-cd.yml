name: Shopizer CI/CD Pipeline

on:
  push:
    branches: [main, develop, git-pipeline]
  pull_request:
    branches: [main, develop, git-pipeline]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  DOCKER_IMAGE: shopizerecomm/shopizer

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      - name: Run Unit Tests
        run: mvn test
      
      - name: Generate JaCoCo Coverage Report
        run: mvn jacoco:report
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-shopizer
          fail_ci_if_error: false
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-jar
          path: sm-shop/target/*.jar
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run SpotBugs
        run: mvn spotbugs:check
        continue-on-error: true
      
      - name: Run Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true
      
      - name: SonarCloud Scan
        if: github.event_name == 'push' && github.repository_owner == 'shopizer-ecommerce'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=shopizer \
            -Dsonar.organization=shopizer \
            -Dsonar.host.url=https://sonarcloud.io
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: OWASP Dependency Check
        run: |
          mvn dependency-check:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=dependency-check-suppressions.xml
        continue-on-error: true
      
      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
      
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  docker-build:
    name: Build Docker Image and Save Artifact
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/git-pipeline')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: shopizer-jar
          path: sm-shop/target/
      
      - name: Verify JAR exists
        run: |
          ls -lh sm-shop/target/*.jar
          echo "✅ JAR artifact downloaded"
      
      - name: Build Docker image
        run: |
          cd sm-shop
          DOCKER_BUILDKIT=0 docker build -t shopizerecomm/shopizer:latest .
          echo "✅ Docker image built successfully"
      
      - name: Test image
        run: |
          docker run --rm shopizerecomm/shopizer:latest java -version
          echo "✅ Image validation passed"
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        run: |
          docker push shopizerecomm/shopizer:latest
          echo "✅ Image pushed to Docker Hub"
      
      - name: Save image as compressed artifact
        run: |
          echo "💾 Saving image (this may take 2-3 minutes)..."
          DOCKER_BUILDKIT=0 docker save shopizerecomm/shopizer:latest | gzip > shopizer-backend-image.tar.gz
          ls -lh shopizer-backend-image.tar.gz
          echo "✅ Image saved as artifact"
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: shopizer-backend-image.tar.gz
          retention-days: 7
          compression-level: 0
      
      - name: Deployment Instructions
        run: |
          echo "════════════════════════════════════════════════════"
          echo "✅ Docker image saved as artifact: backend-docker-image"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "📥 To deploy on local server with Colima:"
          echo ""
          echo "1. Download artifact:"
          echo "   gh run download --name backend-docker-image"
          echo ""
          echo "2. Deploy:"
          echo "   ./scripts/deploy-from-artifact.sh shopizer-backend-image.tar.gz"
          echo ""
          echo "════════════════════════════════════════════════════"
